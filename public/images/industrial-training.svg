<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff8e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffedd0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="300" height="200" fill="url(#bg)" rx="12"/>
  <!-- Building / Industry -->
  <rect x="60" y="60" width="70" height="90" rx="4" fill="#f59a27" opacity="0.3"/>
  <rect x="60" y="60" width="70" height="90" rx="4" fill="none" stroke="#f59a27" stroke-width="2"/>
  <!-- Windows -->
  <rect x="70" y="72" width="14" height="14" rx="2" fill="#ffffff" stroke="#f59a27" stroke-width="1.5"/>
  <rect x="92" y="72" width="14" height="14" rx="2" fill="#ffffff" stroke="#f59a27" stroke-width="1.5"/>
  <rect x="70" y="96" width="14" height="14" rx="2" fill="#ffffff" stroke="#f59a27" stroke-width="1.5"/>
  <rect x="92" y="96" width="14" height="14" rx="2" fill="#ffffff" stroke="#f59a27" stroke-width="1.5"/>
  <!-- Door -->
  <rect x="82" y="125" width="18" height="25" rx="3" fill="#e65100"/>
  <!-- Graduation cap -->
  <polygon points="200,50 230,65 200,80 170,65" fill="#f59a27"/>
  <rect x="196" y="45" width="8" height="10" rx="2" fill="#e65100"/>
  <line x1="230" y1="65" x2="230" y2="85" stroke="#f59a27" stroke-width="2"/>
  <circle cx="230" cy="87" r="3" fill="#ffd54f"/>
  <!-- Person with briefcase -->
  <circle cx="200" cy="100" r="12" fill="#f59a27"/>
  <rect x="188" y="114" width="24" height="32" rx="8" fill="#f59a27"/>
  <!-- Briefcase -->
  <rect x="215" y="125" width="20" height="16" rx="3" fill="#e65100"/>
  <rect x="220" y="122" width="10" height="5" rx="2" fill="none" stroke="#e65100" stroke-width="1.5"/>
  <!-- Gear -->
  <circle cx="260" cy="60" r="15" fill="none" stroke="#f59a27" stroke-width="3"/>
  <circle cx="260" cy="60" r="6" fill="#f59a27"/>
  <line x1="260" y1="42" x2="260" y2="48" stroke="#f59a27" stroke-width="3" stroke-linecap="round"/>
  <line x1="260" y1="72" x2="260" y2="78" stroke="#f59a27" stroke-width="3" stroke-linecap="round"/>
  <line x1="242" y1="60" x2="248" y2="60" stroke="#f59a27" stroke-width="3" stroke-linecap="round"/>
  <line x1="272" y1="60" x2="278" y2="60" stroke="#f59a27" stroke-width="3" stroke-linecap="round"/>
  <!-- Certificate -->
  <rect x="40" y="38" width="30" height="22" rx="3" fill="#ffffff" stroke="#f59a27" stroke-width="1.5"/>
  <rect x="46" y="44" width="18" height="2" rx="1" fill="#ffcc80"/>
  <rect x="46" y="49" width="12" height="2" rx="1" fill="#ffcc80"/>
  <circle cx="55" cy="56" r="3" fill="#ffd54f"/>
  <!-- Decorative -->
  <circle cx="45" cy="160" r="4" fill="#f59a27" opacity="0.4"/>
  <circle cx="265" cy="150" r="3" fill="#e65100" opacity="0.5"/>
  <!-- Ground -->
  <line x1="30" y1="155" x2="270" y2="155" stroke="#ffcc80" stroke-width="2" stroke-dasharray="5,5"/>
</svg>
