<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0d0ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="300" height="200" fill="url(#bg)" rx="12"/>
  <!-- Mountain / Boot Camp tent -->
  <polygon points="150,35 210,130 90,130" fill="#7c4dff" opacity="0.3"/>
  <polygon points="150,55 195,130 105,130" fill="#7c4dff" opacity="0.5"/>
  <!-- Tent door -->
  <polygon points="150,90 165,130 135,130" fill="#311b92" opacity="0.4"/>
  <!-- Flag on top -->
  <line x1="150" y1="35" x2="150" y2="20" stroke="#7c4dff" stroke-width="2"/>
  <polygon points="150,20 170,28 150,36" fill="#ff6e40"/>
  <!-- Fire -->
  <ellipse cx="230" cy="145" rx="15" ry="5" fill="#795548"/>
  <ellipse cx="230" cy="140" rx="6" ry="12" fill="#ff6e40"/>
  <ellipse cx="230" cy="135" rx="4" ry="8" fill="#ffd54f"/>
  <!-- Person running -->
  <circle cx="70" cy="100" r="10" fill="#7c4dff"/>
  <rect x="62" y="112" width="16" height="25" rx="6" fill="#7c4dff"/>
  <!-- Running legs -->
  <line x1="66" y1="135" x2="58" y2="150" stroke="#7c4dff" stroke-width="3" stroke-linecap="round"/>
  <line x1="74" y1="135" x2="82" y2="150" stroke="#7c4dff" stroke-width="3" stroke-linecap="round"/>
  <!-- Arms -->
  <line x1="62" y1="118" x2="52" y2="110" stroke="#7c4dff" stroke-width="3" stroke-linecap="round"/>
  <line x1="78" y1="118" x2="88" y2="110" stroke="#7c4dff" stroke-width="3" stroke-linecap="round"/>
  <!-- Stars -->
  <circle cx="50" cy="50" r="3" fill="#ce93d8"/>
  <circle cx="260" cy="55" r="4" fill="#7c4dff" opacity="0.5"/>
  <circle cx="270" cy="90" r="3" fill="#ff6e40" opacity="0.6"/>
  <!-- Ground line -->
  <line x1="30" y1="155" x2="270" y2="155" stroke="#b39ddb" stroke-width="2" stroke-dasharray="5,5"/>
  <!-- Rocket -->
  <rect x="240" y="55" width="12" height="30" rx="6" fill="#7c4dff"/>
  <polygon points="246,50 240,65 252,65" fill="#7c4dff"/>
  <polygon points="240,85 236,92 244,85" fill="#ff6e40"/>
  <polygon points="252,85 256,92 248,85" fill="#ff6e40"/>
  <ellipse cx="246" cy="90" rx="3" ry="8" fill="#ffd54f" opacity="0.8"/>
</svg>
